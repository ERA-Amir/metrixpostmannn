$kind: http-request
name: МАСС РЕГ чека пот СБРОС ПУЛЛ по итерации (улучш2)
url: "{{base_url}}/api/v2/admin/users/{{user_id}}/receipts/manual"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "mall_id": 5,
      "company_bin": "770216402492",
      "total_amount": {{amount}},
      "receipt_time": "{{receipt_time}}",
      "items": [
        { "name": "{{item_name}}", "quantity": 1, "price": {{amount}}, "sum": {{amount}} }
      ]
    }
auth:
  type: inherit
  credentials:
    id: 1b7193a0-15a7-4cfd-a94d-c01a377e2bfa
scripts:
  - type: beforeRequest
    code: |-
      // Целевой ТРЦ и арендатор для этого прогона 
      pm.collectionVariables.set('mall_id', 5);
      pm.collectionVariables.set('company_bin', '770216402492');

      //  Один раз за весь прогон: подтягиваем актуальный список всех пользователей 
      if (!pm.collectionVariables.get('user_pool_ready')) {
          try {
              const res = await pm.sendRequest({
                  url: pm.environment.get('base_url') + '/api/v2/admin/users?limit=500&offset=0',
                  method: 'GET',
                  header: { Authorization: 'Bearer ' + pm.environment.get('access_token') }
              });
              const data = res.json();
              let ids = data.items.map(u => u.id);

              for (let i = ids.length - 1; i > 0; i--) {
                  const j = Math.floor(Math.random() * (i + 1));
                  [ids[i], ids[j]] = [ids[j], ids[i]];
              }

              pm.collectionVariables.set('user_pool', JSON.stringify(ids));
              pm.collectionVariables.set('user_pool_ready', 'true');
              console.log('Загружено пользователей в пул:', ids.length);
          } catch (e) {
              console.error('Не удалось загрузить список пользователей:', e);
          }
      }

      // Берём следующего пользователя из пула (без повторов)
      let pool = JSON.parse(pm.collectionVariables.get('user_pool') || '[]');
      const userId = pool.pop();
      pm.collectionVariables.set('user_pool', JSON.stringify(pool));
      pm.collectionVariables.set('user_id', userId);

      // Случайная сумма чека (от 20 000)
      const amount = Math.floor(Math.random() * ((70000 - 20000) / 500 + 1)) * 500 + 20000;
      pm.collectionVariables.set('amount', amount);

      // Случайная дата за последние 10 дней
      const d = new Date();
      d.setUTCDate(d.getUTCDate() - (Math.floor(Math.random() * 10) + 1));
      d.setUTCHours(Math.floor(Math.random() * 10) + 9, Math.floor(Math.random() * 60), 0, 0);
      pm.collectionVariables.set('receipt_time', d.toISOString().replace(/\.\d+Z$/, '.000Z'));

      // Случайное название товара
      const items = ['Наушники','Кроссовки','Рюкзак','Куртка','Термокружка','Футболка','Часы','Кепка','Сумка','Плед','Носки','Зонт','Свитшот','Кружка','Перчатки','Шарф','Портфель'];
      pm.collectionVariables.set('item_name', items[Math.floor(Math.random() * items.length)]);

      // Пауза перед отправкой (лимит 20 запросов/минуту)
      const delayMs = 3500;
      const start = Date.now();
      while (Date.now() - start < delayMs) {
          // синхронная пауза перед каждым запросом
      }
    language: text/javascript
order: 2914121551292515
