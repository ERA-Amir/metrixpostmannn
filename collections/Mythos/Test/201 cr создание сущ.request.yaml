$kind: http-request
name: 201 cr создание сущ
url: "{{base_url_M}}/mythology"
method: POST
body:
  type: json
  content: |-
    {
      "name": "ТЦК",
      "category": "gods",
      "desc": "Бог морей и землетрясений.",
      "img": "https://images.unsplash.com/photo-1503152394-c571994fd383"
    }
order: 4392454335096144
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 201", function () {
        pm.response.to.have.status(201);
      });
      pm.test("Response has id field (number)", function () {
        var json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.expect(json.id).to.be.a("number");
      });
      pm.test("name equals 'ТЦК'", function () {
        var json = pm.response.json();
        pm.expect(json.name).to.eql("ТЦК");
      });
      pm.test("category equals 'gods'", function () {
        var json = pm.response.json();
        pm.expect(json.category).to.eql("gods");
      });
      pm.test("desc equals 'Бог морей и землетрясений.'", function () {
        var json = pm.response.json();
        pm.expect(json.desc).to.eql("Бог морей и землетрясений.");
      });
      pm.environment.set("entity_id", pm.response.json().id);
      pm.test("Response time is less than 2000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });
