$kind: http-request
name: 200 OK- Все сущ
url: "{{base_url_M}}/mythology"
method: GET
order: 1786509501199
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response is an array", function () {
        var json = pm.response.json();
        pm.expect(json).to.be.an("array");
      });
      pm.test("Array length is greater than 0", function () {
        var json = pm.response.json();
        pm.expect(json.length).to.be.above(0);
      });
      pm.test("Each item has id, name, category, desc, img fields", function () {
        var json = pm.response.json();
        json.forEach(function (item) {
          pm.expect(item).to.have.property("id");
          pm.expect(item).to.have.property("name");
          pm.expect(item).to.have.property("category");
          pm.expect(item).to.have.property("desc");
          pm.expect(item).to.have.property("img");
        });
      });
      pm.test("Response time is less than 2000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });
    language: text/javascript
